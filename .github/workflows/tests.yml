name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  font-and-review-tests:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install fonttools==4.66.1
      - run: python test_backend.py
      - run: swiftc -swift-version 5 -D TESTING -parse-as-library GlyphCheck.swift Workbench.swift Localization.swift test_engine.swift -o test-engine -framework SwiftUI -framework AppKit -framework CoreText
      - run: ./test-engine
